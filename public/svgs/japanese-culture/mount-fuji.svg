<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- 空の背景 -->
  <rect width="200" height="150" fill="#87CEEB" />
  
  <!-- 富士山 -->
  <path d="M0,150 C50,130 70,60 100,40 C130,60 150,130 200,150 Z" fill="#E6E6E6" />
  <!-- 雪冠 -->
  <path d="M70,60 C80,50 90,45 100,40 C110,45 120,50 130,60 C110,65 90,65 70,60 Z" fill="white" />
  
  <!-- 山麓部分 -->
  <path d="M0,150 L200,150 L200,130 L0,130 Z" fill="#228B22" />
  
  <!-- 朝日 -->
  <circle cx="160" cy="40" r="15" fill="#FF0000" />
</svg>